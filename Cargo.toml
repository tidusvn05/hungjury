[package]
name = "hungjury"
version = "0.2.1"
edition = "2024"
description = "Typed decisions from a jury of headless CLI agents, with precedent memory"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["llm", "cli", "decision", "jury", "agents"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "process",
    "macros",
    "time",
    "sync",
    "fs",
    "io-util",
    "signal",
] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
